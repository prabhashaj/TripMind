[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "Production-grade AI Travel Agent backend"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # --- Pydantic ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "geoalchemy2>=0.14.7",
    "psycopg[binary,pool]>=3.1.19",

    # --- Redis ---
    "redis[hiredis]>=5.0.4",

    # --- LLM — Mistral ---
    "mistralai>=1.0.0",

    # --- AI Workflow ---
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",

    # --- Web Search — Tavily ---
    "tavily-python>=0.3.4",

    # --- HTTP Client ---
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",

    # --- Utilities ---
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cachetools>=5.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
